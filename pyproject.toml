[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-acp-connector"
version = "0.1.0"
description = "Telegram gateway and edge connector for ACP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-telegram-bot>=22.0",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.6",
  "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[project.scripts]
telegram-acp-connector = "telegram_acp_connector.cli:main"
gateway = "telegram_acp_connector.cli:gateway_main"
connector = "telegram_acp_connector.cli:connector_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
